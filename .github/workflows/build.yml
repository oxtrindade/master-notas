name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar zip de atualização (VERSAO-x.y.z.zip)
        run: |
          shopt -s nullglob
          zips=(VERSAO-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Nenhum VERSAO-*.zip na raiz. Compilando o que já está no repositório."
            exit 0
          fi
          ZIP=$(printf '%s\n' "${zips[@]}" | sort -V | tail -1)
          echo "Aplicando $ZIP"
          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q -o "$ZIP" -d /tmp/upd
          rm -rf /tmp/upd/__MACOSX
          SRC=/tmp/upd
          if [ "$(ls -A /tmp/upd | wc -l)" -eq 1 ] && [ -d "/tmp/upd/$(ls -A /tmp/upd)" ]; then
            SRC="/tmp/upd/$(ls -A /tmp/upd)"
          fi
          tar -C "$SRC" --exclude='./.git' --exclude='./.github' --exclude='./ci' --exclude='./VERSAO-*.zip' -cf - . | tar -xf -
          rm -f VERSAO-*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualização $ZIP" || echo "Nada mudou"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android do projeto
        run: |
          flutter create --org com.rodrigo --project-name master_notas --platforms android .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Master Notas"/' android/app/src/main/AndroidManifest.xml
          if [ -d assets/android-icons ]; then cp -r assets/android-icons/. android/app/src/main/res/; fi

      - name: Instalar código nativo (widget)
        run: |
          if [ -f native/setup.sh ]; then bash native/setup.sh; fi

      - name: Usar chave de assinatura fixa (para atualizar por cima)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Ler versão
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "MasterNotas-$V.apk"

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: MasterNotas-${{ steps.ver.outputs.v }}
          path: MasterNotas-${{ steps.ver.outputs.v }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Master Notas ${{ steps.ver.outputs.v }}
          files: MasterNotas-${{ steps.ver.outputs.v }}.apk
